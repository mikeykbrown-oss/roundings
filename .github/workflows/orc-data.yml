name: Refresh ORC certificate data

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and slim ORC data
        run: python3 scripts/update_orc.py
      - name: Commit if changed
        run: |
          git config user.name "orc-data-bot"
          git config user.email "actions@github.com"
          git add data/orc
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Weekly ORC certificate data refresh"
          git push
